<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaShop — Productos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          GigaShop
          <span class="navbar__tagline">Periféricos & Componentes</span>
        </div>
      </a>
      <div class="navbar__nav">
        <a href="productos.html" class="navbar__link active">  
          <i class="fa-solid fa-desktop"></i>
          Productos</a>
        <a href="carrito.html" class="cart-btn">
          <i class="fa-solid fa-cart-shopping"></i>Carrito <span class="cart-count" id="nav-cart-count">0</span>
        </a>
        <span id="cliente-navbar" class="navbar__pill navbar__user"></span>

        <button
          class="navbar__pill"
          onclick="cambiarCliente()">
          <i class="fa-solid fa-right-left"></i>
          Cambiar usuario
        </button>
        <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <div class="container">

    <div class="page-header">
      <div>
        <div class="page-header__title" id="saludo">Productos</div>
        <div
          class="page-header__sub"
          id="cantidad-productos">
          Elegí tus productos y agregálos al carrito
        </div>
      </div>
    </div>

    <div class="category-tabs">
      <button class="category-tab active" onclick="cambiarCategoria('todos', this)"><i class="fa-solid fa-layer-group"></i> Todos</button>
      <button class="category-tab" onclick="cambiarCategoria('periferico', this)"><i class="fa-solid fa-keyboard"></i> Periféricos</button>
      <button class="category-tab" onclick="cambiarCategoria('componente', this)"><i class="fa-solid fa-microchip"></i> Componentes</button>
    </div>

    <div class="filters-bar">
      <input
          type="text"
          id="buscador"
          placeholder=" Buscar productos..."
          oninput="buscarProductos(this.value)"
        >

      <select id="orden-select" onchange="cambiarOrden(this.value)">
        <option value="default">Ordenar por</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
        <option value="nombre-asc">Nombre: A-Z</option>
        <option value="nombre-desc">Nombre: Z-A</option>
      </select>

      <label>
          <input
              type="checkbox"
              id="filtro-stock"
              onchange="toggleStock()">

          Solo con stock
      </label>

    </div>

    <div class="products-layout">

      <div>
        <div class="products-grid" id="products-grid">
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

      <div class="cart-sidebar">
        <div class="cart-sidebar__title">
          <i class="fa-solid fa-cart-shopping"></i>Tu carrito
          <span class="cart-count" id="sidebar-cart-count">0</span>
        </div>
        <div id="cart-sidebar-items">
          <div class="cart-sidebar__empty">Tu carrito está vacío</div>
        </div>
        <div id="cart-sidebar-footer" style="display:none">
          <div class="cart-sidebar__total">
            <span>Total</span>
            <span class="cart-sidebar__total-amount" id="sidebar-total">$0</span>
          </div>
          <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="carrito.html" class="btn btn-primary btn-block">Ver carrito completo</a>
            <button
              class="btn btn-secondary btn-block"
              onclick="vaciarCarrito()">
              <i class="fa-solid fa-trash"></i>Vaciar carrito
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-overlay" id="modal-agregado">
    <div class="modal">
      <div class="modal__icon"><i class="fa-solid fa-circle-check"></i></div>
      <div class="modal__title">¡Producto agregado!</div>
      <div class="modal__body" id="modal-agregado-texto"></div>
      <div class="modal__actions">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-agregado')">Seguir comprando</button>
        <a href="carrito.html" class="btn btn-primary">Ver carrito</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-confirmacion">
    <div class="modal">
      <div class="modal__icon modal__icon--confirm">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <div class="modal__title" id="confirm-title">
        Confirmar acción
      </div>

      <div class="modal__body" id="confirm-body">
        ¿Estás seguro?
      </div>

      <div class="modal__actions">
        <button
          class="btn btn-secondary"
          onclick="cerrarModal('modal-confirmacion')">
          Cancelar
        </button>

        <button
          class="btn btn-primary"
          id="confirm-btn">
          Confirmar
        </button>
      </div>
    </div>
  </div>

  <script>
    let ordenActual = "default";
    let textoBusqueda = "";
    let soloConStock = false;

    const filtrosGuardados = JSON.parse(
        localStorage.getItem("filtrosProductos")
    );

    if (filtrosGuardados) {

        ordenActual = filtrosGuardados.ordenActual || "default";
        textoBusqueda = filtrosGuardados.textoBusqueda || "";
        soloConStock = filtrosGuardados.soloConStock || false;

    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-toggle').innerHTML =
      savedTheme === 'dark'
        ? '<i class="fa-solid fa-moon"></i>'
        : '<i class="fa-solid fa-sun"></i>';



    function cambiarOrden(orden) {

      ordenActual = orden;

      guardarFiltros();

      paginaActual = 1;

      renderizarProductos();

    }

    function buscarProductos(texto) {

      textoBusqueda = texto.toLowerCase();

      guardarFiltros();

      paginaActual = 1;

      renderizarProductos();

    }

    function toggleStock() {

        soloConStock = document.getElementById("filtro-stock").checked;

        guardarFiltros();

        paginaActual = 1;

        renderizarProductos();
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.querySelector('.theme-toggle').innerHTML =
        next === 'dark'
          ? '<i class="fa-solid fa-moon"></i>'
          : '<i class="fa-solid fa-sun"></i>';
    }

    const clienteNombre = localStorage.getItem('clienteNombre');
    if (!clienteNombre) window.location.href = 'index.html';
    document.getElementById('saludo').innerHTML = `Hola, ${clienteNombre}!`;
    document.getElementById('cliente-navbar').innerHTML =`<i class="fa-solid fa-user"></i> ${clienteNombre}`;

    let carrito = JSON.parse(localStorage.getItem('carrito') || '[]');

    function mostrarConfirmacion(
      titulo,
      mensaje,
      callback
    ) {
      document.getElementById("confirm-title").textContent =
        titulo;

      document.getElementById("confirm-body").textContent =
        mensaje;

      const btn = document.getElementById("confirm-btn");

      btn.onclick = () => {
        cerrarModal("modal-confirmacion");
        callback();
      };

      abrirModal("modal-confirmacion", false);
    }

    function guardarCarrito() {
      localStorage.setItem('carrito', JSON.stringify(carrito));
      actualizarContadores();
      renderizarSidebar();
    }

    function guardarFiltros() {

        localStorage.setItem("filtrosProductos", JSON.stringify({
            ordenActual,
            textoBusqueda,
            soloConStock
        }));

    }

    function actualizarContadores() {
      const total = carrito.reduce((s, i) => s + i.cantidad, 0);
      document.getElementById('nav-cart-count').textContent = total;
      document.getElementById('sidebar-cart-count').textContent = total;
    }

    function agregarAlCarrito(producto) {
      const existe = carrito.find(i => i.id === producto.id);
      if (existe) {

        if (existe.cantidad >= producto.stock) {
          alert(`Solo hay ${producto.stock} unidades disponibles`);
          return;
        }

        existe.cantidad++;

      } else {

        if (producto.stock <= 0) {
          alert("Producto sin stock");
          return;
        }

        carrito.push({
          ...producto,
          cantidad: 1
        });
      }
      guardarCarrito();
      renderizarProductos();
      document.getElementById('modal-agregado-texto').textContent =
        `${producto.nombre} fue agregado al carrito.`;
      abrirModal('modal-agregado');
    }

    function vaciarCarrito() {

      mostrarConfirmacion(
        "Vaciar carrito",
        "Se eliminarán todos los productos del carrito.",
        () => {

          carrito = [];

          guardarCarrito();

          renderizarProductos();
        }
      );
    }

    function cambiarCantidad(id, delta) {

      let item = carrito.find(i => i.id === id);

      if (!item) {

        if (delta <= 0) return;

        const producto = todosLosProductos.find(p => p.id === id);

        if (!producto) return;

        if (producto.stock <= 0) {
          alert("Producto sin stock");
          return;
        }

        item = {
          ...producto,
          cantidad: 0
        };

        carrito.push(item);
      }

      const nuevaCantidad = item.cantidad + delta;

      if (nuevaCantidad > item.stock) {
        alert(`Solo hay ${item.stock} unidades disponibles`);
        return;
      }

      item.cantidad = nuevaCantidad;

      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }

      guardarCarrito();
      renderizarProductos();
    }

    function eliminarDelCarrito(id) {
      carrito = carrito.filter(i => i.id !== id);
      guardarCarrito();
      renderizarProductos();
    }

    function getCantidadEnCarrito(id) {
      const item = carrito.find(i => i.id === id);
      return item ? item.cantidad : 0;
    }

    function renderizarSidebar() {
      const container = document.getElementById('cart-sidebar-items');
      const footer    = document.getElementById('cart-sidebar-footer');

      if (carrito.length === 0) {
        container.innerHTML = '<div class="cart-sidebar__empty">Tu carrito está vacío</div>';
        footer.style.display = 'none';
        return;
      }

      footer.style.display = 'block';
      container.innerHTML = carrito.map(item => `
        <div class="cart-item">
          <div class="cart-item__img" style="display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:var(--bg-card-alt)">
            ${item.imagen ? `<img src="/images/${item.imagen}" style="width:44px;height:44px;object-fit:cover;border-radius:6px">` : '<i class="fa-solid fa-box"></i>'}
          </div>
          <div class="cart-item__info">
            <div class="cart-item__name">${item.nombre}</div>
            <div class="cart-item__price">x${item.cantidad} — $${(item.precio * item.cantidad).toLocaleString()}</div>
          </div>
          <button class="cart-item__remove" onclick="eliminarDelCarrito(${item.id})"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');

      const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
      document.getElementById('sidebar-total').textContent = '$' + total.toLocaleString();
    }

    const PRODUCTOS_POR_PAGINA = 6;
    let paginaActual = 1;
    let categoriaActual = 'todos';
    let todosLosProductos = [];

    function productosFiltrados() {

      let productos;

      if (categoriaActual === 'todos') {

        productos = [...todosLosProductos];

      } else {

        productos = todosLosProductos.filter(
          p => p.categoria.toLowerCase() === categoriaActual
        );

      }

      if (textoBusqueda) {

        productos = productos.filter(producto =>
          producto.nombre.toLowerCase().includes(textoBusqueda) ||
          producto.marca.toLowerCase().includes(textoBusqueda) ||
          producto.categoria.toLowerCase().includes(textoBusqueda)
        );

      }

      if (soloConStock) {
          productos = productos.filter(
              p => p.stock > 0
          );
      }

      switch (ordenActual) {

        case "precio-asc":
          productos.sort((a, b) => a.precio - b.precio);
          break;

        case "precio-desc":
          productos.sort((a, b) => b.precio - a.precio);
          break;

        case "nombre-asc":
          productos.sort((a, b) =>
            a.nombre.localeCompare(b.nombre)
          );
          break;

        case "nombre-desc":
          productos.sort((a, b) =>
            b.nombre.localeCompare(a.nombre)
          );
          break;

      }

      return productos;

    }

    function mostrarSkeletons() {

      document.getElementById('products-grid').innerHTML =
        Array(6).fill(`
          <div class="product-card skeleton-card">
            <div class="skeleton skeleton-img"></div>

            <div class="product-card__body">
              <div class="skeleton skeleton-badge"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-title short"></div>
              <div class="skeleton skeleton-price"></div>
            </div>

            <div class="product-card__footer">
              <div class="skeleton skeleton-button"></div>
            </div>
          </div>
        `).join('');
    }

    function cargarProductos() {

      mostrarSkeletons();
      fetch('/api/productos', { cache: 'no-store' })
        .then(r => r.json())
          .then(data => {

            setTimeout(() => {

              todosLosProductos = data.productos || data;

              renderizarProductos();

            }, 1500);

          })
        .catch(error => {
          console.error("Error al cargar productos:", error);
        });
    }

    function renderizarProductos() {
      const filtrados = productosFiltrados();
      document.getElementById(
        'cantidad-productos'
      ).textContent =
        `${filtrados.length} productos disponibles`;
      const totalPaginas = Math.ceil(filtrados.length / PRODUCTOS_POR_PAGINA);
      if (paginaActual > totalPaginas) paginaActual = 1;

      const inicio = (paginaActual - 1) * PRODUCTOS_POR_PAGINA;
      const pagina = filtrados.slice(inicio, inicio + PRODUCTOS_POR_PAGINA);

      const grid = document.getElementById('products-grid');
      

      if (pagina.length === 0) {

          let mensaje = "No encontramos productos";

          if (textoBusqueda.trim() !== "") {
              mensaje = `No encontramos productos para "${textoBusqueda}"`;
          }

          grid.innerHTML = `
              <div class="empty-state" style="grid-column:1/-1">
                  <div class="empty-state__icon">
                      <i class="fa-solid fa-face-frown"></i>
                  </div>
                  <div class="empty-state__title">
                      ${mensaje}
                  </div>
              </div>
          `;

          document.getElementById('pagination').innerHTML = '';

          return;
      }

      grid.innerHTML = pagina.map(p => {
        const qty = getCantidadEnCarrito(p.id);

        const ribbonHtml =
          p.stock === 0
            ? `<div class="product-ribbon">SIN STOCK</div>`
            : '';

        const imgHtml = p.imagen
            ? `<img src="/images/${p.imagen}" class="product-card__img" alt="${p.nombre}">`
            : `<div class="product-card__img-placeholder"><i class="fa-solid fa-box"></i></div>`;

        const badgeClass =
            p.categoria === "Periferico"
                ? "badge-periferico"
                : "badge-componente";

        const badgeLabel = p.categoria;

        const stockHtml =
          p.stock > 0
            ? `<div class="stock-ok">Stock: ${p.stock}</div>`
            : `<div class="stock-badge stock-badge--out"><i class="fa-solid fa-triangle-exclamation"></i>Sin stock</div>`;

        return `
          <div class="product-card ${p.stock === 0 ? 'product-card--out' : ''}">

            ${ribbonHtml}

            ${imgHtml}

            <div class="product-card__body">
              <span class="product-card__badge ${badgeClass}">
                ${badgeLabel}
              </span>

              <div class="product-card__name">${p.nombre}</div>

              <div class="product-card__desc">
                ${p.descripcion || ''}
              </div>

              <div class="product-card__price">
                $${p.precio.toLocaleString()}
              </div>

              ${stockHtml}
            </div>

            <div class="product-card__footer">

              ${
                qty === 0
                  ? (
                      p.stock === 0
                        ? `
                          <button
                            class="btn btn-sm btn-out-stock"
                            disabled>
                            Sin stock
                          </button>
                        `
                        : `
                          <button
                            class="btn btn-primary btn-sm"
                            onclick='agregarAlCarrito(${JSON.stringify(p)})'>
                            + Agregar
                          </button>
                        `
                    )
                  : `
                    <div class="qty-control">
                      <button
                        class="qty-btn"
                        onclick="cambiarCantidad(${p.id}, -1)">
                        −
                      </button>

                      <span class="qty-num">${qty}</span>

                      <button
                        class="qty-btn"
                        onclick="cambiarCantidad(${p.id}, 1)"
                        ${qty >= p.stock ? 'disabled style="opacity:0.3"' : ''}>
                        +
                      </button>
                    </div>
                  `
              }

            </div>

          </div>
        `;
      }).join('');

      renderizarPaginacion(totalPaginas);
    }

    function renderizarPaginacion(total) {
      const pag = document.getElementById('pagination');
      if (total <= 1) { pag.innerHTML = ''; return; }

      let html = `<button class="page-btn" onclick="irPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>`;
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i === paginaActual ? 'active' : ''}" onclick="irPagina(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="irPagina(${paginaActual + 1})" ${paginaActual === total ? 'disabled' : ''}>›</button>`;
      pag.innerHTML = html;
    }

    function irPagina(n) {
      paginaActual = n;
      renderizarProductos();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cambiarCategoria(cat, btn) {
      categoriaActual = cat;
      paginaActual = 1;
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderizarProductos();
    }

    function cambiarCliente() {

      mostrarConfirmacion(
        "Cambiar usuario",
        "Se cerrará la compra actual y se vaciará el carrito para iniciar una nueva compra.",
        () => {

          localStorage.removeItem("clienteNombre");

          localStorage.removeItem("carrito");

          localStorage.removeItem("filtrosProductos");

          window.location.href = "index.html";
        }
      );
    }

    let modalTimeout = null;

    function abrirModal(id, autoClose = true) {

      document.getElementById(id).classList.add('open');

      if (modalTimeout) {
        clearTimeout(modalTimeout);
      }

      if (autoClose) {
        modalTimeout = setTimeout(() => {
          cerrarModal(id);
          modalTimeout = null;
        }, 2500);
      }
    }

    function cerrarModal(id) {

      if (modalTimeout) {
        clearTimeout(modalTimeout);
        modalTimeout = null;
      }

      document.getElementById(id).classList.remove('open');
    }

    actualizarContadores();
    renderizarSidebar();
    document.getElementById("orden-select").value =
        ordenActual;

    document.getElementById("buscador").value =
        textoBusqueda;

    document.getElementById("filtro-stock").checked =
        soloConStock;
    cargarProductos();
  </script>

</body>
</html>
